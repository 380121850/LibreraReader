<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Librera TTS host</title>
</head>
<body>
<script>
/* TTS shim page loaded inside a hidden ArkWeb component.
 * ArkTS drives text-to-speech through the standard Web Speech API
 * (speechSynthesis) via runJavaScript, because @ohos.ai.tts is not
 * present in the OpenHarmony API 24 SDK.
 *
 * runJavaScript JSON-encodes the returned JS value, so every function
 * returns an integer status code (compared as string by ArkTS):
 *   ttsSpeak:  0=ok, -1=no-tts, -2=no-voices, -3=error
 *   ttsStatus: 0=idle, 1=speaking, 2=paused, -1=no-tts
 *   ttsProbe:  voice count (>0), 0=no voices, -1=no-tts
 */
var __current = null;   /* utterance currently owned by us */
var __active = false;   /* a sentence is being spoken */

function ttsProbe() {
  if (!window.speechSynthesis || !('SpeechSynthesisUtterance' in window)) {
    return -1;
  }
  var v = window.speechSynthesis.getVoices();
  return (v && v.length > 0) ? v.length : 0;
}

function ttsSpeak(text, rate, pitch, index) {
  if (!window.speechSynthesis || !('SpeechSynthesisUtterance' in window)) {
    return -1;
  }
  var voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    return -2;
  }
  try {
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = rate;
    u.pitch = pitch;
    u.lang = 'zh-CN';
    __current = u;
    __active = true;
    var endFn = function () {
      /* only clear the active flag for the utterance we actually started */
      if (__current === u) {
        __active = false;
        __current = null;
      }
    };
    u.onend = endFn;
    u.onerror = endFn;
    window.speechSynthesis.speak(u);
    return 0;
  } catch (e) {
    __active = false;
    __current = null;
    return -3;
  }
}

function ttsStatus() {
  if (!window.speechSynthesis) {
    return -1;
  }
  if (window.speechSynthesis.paused) {
    return 2;
  }
  if (__active || window.speechSynthesis.speaking) {
    return 1;
  }
  return 0;
}

function ttsPause() {
  if (window.speechSynthesis) {
    try { window.speechSynthesis.pause(); } catch (e) {}
  }
  return 0;
}

function ttsResume() {
  if (window.speechSynthesis) {
    try { window.speechSynthesis.resume(); } catch (e) {}
  }
  return 0;
}

function ttsStop() {
  __active = false;
  __current = null;
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    try { window.speechSynthesis.resume(); } catch (e) {}
  }
  return 0;
}
</script>
</body>
</html>
