    def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86': 2, 'x86_64': 3]

    applicationVariants.all { variant ->

        variant.outputs.all { output ->

            def flavor = variant.productFlavors[0].name.capitalize()
            def abiName = getFilter("ABI")
/*            if (abiName == "armeabi-v7a") {
                variant.mergedFlavor.manifestPlaceholders.appSafeMode = "true"
                //variant.resValue "string", "[appSafeMode]", "true"
                println abiName + " : appSafeMode true "
            } else {
                variant.mergedFlavor.manifestPlaceholders.appSafeMode = "true"
                //variant.resValue "string", "[appSafeMode]", "false"
                println abiName + " : appSafeMode false"
            }
*/
            if (abiName != null) {
                def code = abiCodes.get(abiName, 0) + variant.versionCode
                abiName = abiName.replace("arm64-v8a", "arm64").replace("armeabi-v7a", "arm")

                output.versionCodeOverride = code
                // the main "Librera" flavor IS the HowRead brand: no flavor tag
                // in the file name; the other flavors keep their tag
                def brand = (flavor == "Librera") ? "HowRead" : "HowRead-${flavor}"

                def fullName = "${brand}-${versionNumber}-${abiName}.apk"

                output.outputFileName = fullName
            } else {
                //def fullName = "Librera ${flavor}-${versionNumber}-c${codeNumber}-d${db}-universal.apk"
                //def fullName = "Librera ${flavor}-${versionNumber}-universal.apk"
                def brand = (flavor == "Librera") ? "HowRead" : "HowRead-${flavor}"
                def fullName = "${brand}-${versionNumber}-uni.apk"
                output.versionCodeOverride = codeNumber
                output.outputFileName = fullName
            }
        }
    }

    sourceSets {
        fdroid { assets.srcDirs = ['src/fdroid/assets', 'src/fdroid/assets/'] }
        // GMS stub classes stand in for the removed play-services deps.
        // Flavors that pull real play-services-base transitively (libDepFree's
        // play-services-ads) must NOT compile them: the same classes exist in
        // play-services-base and clash at dex merge. Only GMS-free flavors
        // (fdroid, pro) compile the stubs from src/gmsStubs.
        fdroid { java.srcDirs += ['src/gmsStubs/java'] }
        pro { java.srcDirs += ['src/gmsStubs/java'] }
        // Native libraries are vendored under prebuilt/native/ (committed .so
        // for all 4 ABIs). Setting srcDirs replaces the default
        // src/main/jniLibs lookup so Gradle packages the prebuilt .so directly
        // (see Builder/prepare-native.sh for the source-build fallback).
        main { jniLibs.srcDirs = ["${rootDir}/prebuilt/native/mupdf-1.23.7"] }
